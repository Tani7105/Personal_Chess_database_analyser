<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chess Analyzer</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.css">
<style>
  :root {
    --bg: #262421; --panel: #302e2b; --panel2: #3a3835; --text: #e8e6e3;
    --muted: #a09d99; --accent: #81b64c; --blunder: #e05252;
    --mistake: #e8a33d; --inaccuracy: #d6c35a;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, system-ui, sans-serif;
         background: var(--bg); color: var(--text); }
  header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center;
           padding: 12px 20px; background: var(--panel); }
  header h1 { font-size: 18px; margin: 0 12px 0 0; }
  select { background: var(--panel2); color: var(--text); border: 1px solid #555;
           border-radius: 6px; padding: 6px 8px; max-width: 100%; }
  label { color: var(--muted); font-size: 14px; }
  main { display: flex; flex-wrap: wrap; gap: 20px; padding: 20px; }
  #boardArea { display: flex; flex-direction: column; gap: 10px; }
  #boardRow { display: flex; gap: 8px; }
  #evalBar { width: 26px; background: #403d39; border-radius: 4px; position: relative;
             overflow: hidden; }
  #evalWhite { position: absolute; bottom: 0; width: 100%; height: 50%;
               background: #f0f0f0; transition: height .4s; }
  #evalText { position: absolute; width: 100%; text-align: center; font-size: 10px;
              font-weight: bold; color: #555; bottom: 4px; z-index: 1; }
  #board { width: min(480px, calc(100vw - 74px)); }
  .controls { display: flex; gap: 8px; }
  .controls button, .card button {
    flex: 1; background: var(--panel2); color: var(--text); border: none;
    border-radius: 6px; padding: 10px; font-size: 14px; cursor: pointer; }
  .controls button:hover, .card button:hover { background: #4b4847; }
  #side { flex: 1; min-width: 280px; max-width: 480px; display: flex;
          flex-direction: column; gap: 12px; }
  .card { background: var(--panel); border-radius: 8px; padding: 12px 14px; }
  .card h2 { font-size: 14px; color: var(--muted); margin: 0 0 8px;
             text-transform: uppercase; letter-spacing: .04em; }
  .muted { color: var(--muted); font-size: 14px; }
  .line { padding: 7px 6px; border-radius: 4px; cursor: pointer; font-size: 14px;
          line-height: 1.4; }
  .line:hover { background: var(--panel2); }
  .score { display: inline-block; min-width: 58px; font-weight: bold; }
  #moves { max-height: 300px; overflow-y: auto; font-size: 14px; line-height: 2; }
  .num { color: var(--muted); margin-left: 4px; }
  .mv { cursor: pointer; padding: 2px 5px; border-radius: 3px; }
  .mv:hover { background: var(--panel2); }
  .mv.current { background: #5a5754; }
  .mv.Best { color: #81b64c; }
  .mv.Blunder { color: var(--blunder); font-weight: bold; }
  .mv.Mistake { color: var(--mistake); font-weight: bold; }
  .mv.Inaccuracy { color: var(--inaccuracy); }
  .sym { font-size: 11px; margin-left: 1px; }
  .review { display: flex; gap: 10px; align-items: flex-start; padding: 10px;
            border-radius: 6px; margin-top: 8px; font-size: 15px; background: var(--panel2); }
  .badge { flex: none; width: 28px; height: 28px; border-radius: 50%; display: grid;
           place-items: center; font-weight: bold; font-size: 13px; color: #fff; }
  .badge.Best { background: #81b64c; }
  .badge.Excellent { background: #96bc4b; }
  .badge.Good { background: #6f9a5a; }
  .badge.Inaccuracy { background: #d4b232; }
  .badge.Mistake { background: #e58f2a; }
  .badge.Blunder { background: #ca3431; }
  .review button { margin-top: 8px; flex: none; padding: 6px 10px; }
  table.summary { width: 100%; border-collapse: collapse; font-size: 14px; }
  table.summary th, table.summary td { padding: 4px 6px; text-align: center; }
  table.summary th:first-child, table.summary td:first-child { text-align: left; }
  table.summary th { color: var(--muted); font-weight: normal; }
  #summaryBox { display: none; }
  #variationBox { display: none; }
  .hl-last { background-color: rgba(246, 246, 105, .55) !important; }
  .hl-best { box-shadow: inset 0 0 0 4px var(--accent); }
</style>
</head>
<body>
<header>
  <h1>Chess Analyzer</h1>
  <select id="gameSelect"></select>
  <label><input type="checkbox" id="analyzedOnly" checked> Analyzed games only</label>
</header>

<main>
  <section id="boardArea">
    <div id="boardRow">
      <div id="evalBar"><div id="evalWhite"></div><div id="evalText">0.0</div></div>
      <div id="board"></div>
    </div>
    <div class="controls">
      <button onclick="toStart()">Start</button>
      <button onclick="back()">Back</button>
      <button onclick="next()">Next</button>
      <button onclick="toEnd()">End</button>
      <button onclick="board.flip(); update()">Flip</button>
    </div>
  </section>

  <section id="side">
    <div class="card">
      <h2 id="gameTitle">Free analysis</h2>
      <div id="status" class="muted"></div>
      <div id="reviewBox"></div>
    </div>

    <div class="card" id="summaryBox">
      <h2>Game review</h2>
      <div id="summary"></div>
    </div>

    <div class="card" id="variationBox">
      <h2>Your line</h2>
      <div id="variationText" style="margin-bottom:10px"></div>
      <button onclick="backToGame()">Back to game</button>
    </div>

    <div class="card">
      <h2>Engine lines</h2>
      <div id="lines" class="muted">Thinking...</div>
    </div>

    <div class="card">
      <h2>Moves</h2>
      <div id="moves" class="muted">Drag a piece to start analyzing.</div>
    </div>
  </section>
</main>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<script>
const START_FEN = 'rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1';
const PIECES = 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png';

let board;
let gameData = null;   // the loaded game from the database (null = free analysis)
let fens = [START_FEN]; // fens[i] = position after i game moves
let ply = 0;           // how many game moves have been played on the board
let variation = [];    // your own moves played on top of the game position
let reviews = [];      // reviews[i] = verdict on game move i (from the server)
const LABELS = ['Best', 'Excellent', 'Good', 'Inaccuracy', 'Mistake', 'Blunder'];
const SYMBOLS = { Best: '\u2605', Excellent: '!', Good: '\u2713',
                  Inaccuracy: '?!', Mistake: '?', Blunder: '??' };
let analysisId = 0;
let analysisTimer = null;

function currentFen() {
  return variation.length ? variation[variation.length - 1].fen : fens[ply];
}

function winPct(cp) {
  return 50 + 50 * (2 / (1 + Math.exp(-0.00368208 * cp)) - 1);
}

function formatScore(line) {
  if (line.mate !== null) return (line.mate > 0 ? '+M' : '-M') + Math.abs(line.mate);
  return (line.cp >= 0 ? '+' : '') + (line.cp / 100).toFixed(2);
}

function highlight(squares, cls) {
  $('#board .square-55d63').removeClass(cls);
  squares.forEach(sq => $('#board .square-' + sq).addClass(cls));
}

// ---------- Loading games ----------
async function loadGames() {
  const analyzed = $('#analyzedOnly').is(':checked') ? 1 : 0;
  const games = await (await fetch('/api/games?analyzed=' + analyzed)).json();
  const options = ['<option value="">Free analysis (starting position)</option>']
    .concat(games.map(g => `<option value="${g.id}">${g.label}</option>`));
  $('#gameSelect').html(options.join(''));
}

async function loadGame(id) {
  variation = [];
  ply = 0;
  reviews = [];
  if (!id) {
    gameData = null;
    fens = [START_FEN];
    board.orientation('white');
    $('#gameTitle').text('Free analysis');
  } else {
    gameData = await (await fetch('/api/game/' + id)).json();
    fens = [gameData.start_fen].concat(gameData.moves.map(m => m.fen));
    reviews = gameData.reviews;
    board.orientation(gameData.my_color);
    $('#gameTitle').text(`${gameData.white} vs ${gameData.black}`);
  }
  renderMoveList();
  renderSummary();
  update();
}

function renderSummary() {
  const hasReview = gameData && reviews.some(r => r && r.label);
  if (!hasReview) { $('#summaryBox').hide(); return; }
  const w = gameData.summary.white, b = gameData.summary.black;
  const you = c => gameData.my_color === c ? ' (you)' : '';
  const acc = a => a === null ? '-' : a.toFixed(1);
  let rows = `<tr><th></th><th>${gameData.white}${you('white')}</th><th>${gameData.black}${you('black')}</th></tr>`;
  rows += `<tr><td>Accuracy</td><td><b>${acc(w.accuracy)}</b></td><td><b>${acc(b.accuracy)}</b></td></tr>`;
  LABELS.forEach(l => {
    rows += `<tr><td><span class="badge ${l}" style="display:inline-grid;width:20px;height:20px;font-size:10px;margin-right:6px">${SYMBOLS[l]}</span>${l}</td>`
          + `<td>${w.counts[l] || 0}</td><td>${b.counts[l] || 0}</td></tr>`;
  });
  $('#summary').html(`<table class="summary">${rows}</table>`);
  $('#summaryBox').show();
}

function showBest() {
  const r = reviews[ply - 1];
  if (!r) return;
  ply--;
  variation = [];
  const g = new Chess(fens[ply]);
  const mv = g.move(r.best);
  if (mv) variation.push({ san: mv.san, from: mv.from, to: mv.to, fen: g.fen() });
  update();
}

// ---------- Moving pieces ----------
function onDragStart(source, piece) {
  const g = new Chess(currentFen());
  if (g.game_over()) return false;
  if ((g.turn() === 'w' && piece[0] === 'b') || (g.turn() === 'b' && piece[0] === 'w')) return false;
}

function onDrop(source, target) {
  if (!playMove(source, target, 'q', true)) return 'snapback';
}

function onSnapEnd() {
  board.position(currentFen());
}

function playMove(from, to, promotion, fromDrag) {
  const g = new Chess(currentFen());
  const mv = g.move({ from, to, promotion: promotion || 'q' });
  if (!mv) return false;

  const nextGameMove = gameData && !variation.length && ply < fens.length - 1
    ? gameData.moves[ply] : null;
  if (nextGameMove && nextGameMove.from === mv.from && nextGameMove.to === mv.to) {
    ply++;                       // you played the actual game move
  } else {
    variation.push({ san: mv.san, from: mv.from, to: mv.to, fen: g.fen() });
  }
  update(fromDrag);
  return true;
}

// ---------- Navigation ----------
function back()  { if (variation.length) variation.pop(); else if (ply > 0) ply--; update(); }
function next()  { if (!variation.length && ply < fens.length - 1) ply++; update(); }
function toStart() { variation = []; ply = 0; update(); }
function toEnd()   { variation = []; ply = fens.length - 1; update(); }
function backToGame() { variation = []; update(); }
function jumpTo(p) { variation = []; ply = p; update(); }

$(document).on('keydown', e => {
  if (e.key === 'ArrowLeft') back();
  if (e.key === 'ArrowRight') next();
});

// ---------- Rendering ----------
function renderMoveList() {
  if (!gameData) { $('#moves').html('<span class="muted">Drag a piece to start analyzing.</span>'); return; }
  const html = gameData.moves.map((m, i) => {
    const num = i % 2 === 0 ? `<span class="num">${i / 2 + 1}.</span>` : '';
    const label = reviews[i] && reviews[i].label ? reviews[i].label : '';
    const sym = ['Inaccuracy', 'Mistake', 'Blunder', 'Best'].includes(label)
      ? `<span class="sym">${SYMBOLS[label]}</span>` : '';
    return `${num}<span class="mv ${label}" data-ply="${i + 1}" onclick="jumpTo(${i + 1})">${m.san}${sym}</span>`;
  });
  $('#moves').html(html.join(' '));
}

function update(fromDrag) {
  if (!fromDrag) board.position(currentFen());

  // last-move highlight
  let last = null;
  if (variation.length) last = variation[variation.length - 1];
  else if (ply > 0 && gameData) last = gameData.moves[ply - 1];
  setTimeout(() => highlight(last ? [last.from, last.to] : [], 'hl-last'), 0);

  // current move in the list
  $('.mv').removeClass('current');
  if (!variation.length && ply > 0) {
    const el = $(`.mv[data-ply="${ply}"]`).addClass('current')[0];
    if (el) el.scrollIntoView({ block: 'nearest' });
  }

  // status text
  const g = new Chess(currentFen());
  let status = g.turn() === 'w' ? 'White to move' : 'Black to move';
  if (gameData) status += ` | ${gameData.date} | ${gameData.opening || ''} | Result ${gameData.result}`;
  $('#status').text(status);

  // verdict on the move that led to this position
  $('#reviewBox').html(!variation.length && ply > 0 && gameData ? reviewHtml(ply - 1) : '');

  // your line
  if (variation.length) {
    $('#variationBox').show();
    $('#variationText').text(variation.map(v => v.san).join(' '));
  } else {
    $('#variationBox').hide();
  }

  // ask the engine (short delay so fast clicking doesn't queue up requests)
  clearTimeout(analysisTimer);
  analysisTimer = setTimeout(requestAnalysis, 250);
}

function reviewHtml(i) {
  const r = reviews[i];
  const move = gameData.moves[i].san;
  const mover = i % 2 === 0 ? 'white' : 'black';
  const who = mover === gameData.my_color ? 'You' : 'Opponent';
  if (!r) return `<div class="review"><div>${who} played <b>${move}</b>. `
    + `<span class="muted">This game hasn't been analyzed yet.</span></div></div>`;
  if (!r.label) return `<div class="review"><div>${who} played <b>${move}</b>, the final move.</div></div>`;

  let text;
  if (r.label === 'Best') {
    text = `<b>${move}</b> is the best move.`;
  } else {
    const lost = r.drop >= 10 ? ` It lost ${r.drop}% win chance.` : '';
    const verdict = ['Excellent', 'Good'].includes(r.label)
      ? r.label.toLowerCase()
      : (r.label === 'Inaccuracy' ? 'an inaccuracy' : 'a ' + r.label.toLowerCase());
    text = `<b>${move}</b> is ${verdict}.${lost} `
         + `The best move was <b>${r.best}</b>.`
         + `<br><button onclick="showBest()">Show best move</button>`;
  }
  return `<div class="review"><span class="badge ${r.label}">${SYMBOLS[r.label]}</span>`
       + `<div><span class="muted">${who}</span><br>${text}</div></div>`;
}

async function requestAnalysis() {
  const id = ++analysisId;
  const fen = currentFen();
  $('#lines').html('<span class="muted">Thinking...</span>');
  let data;
  try {
    const res = await fetch('/api/analyze', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ fen })
    });
    data = await res.json();
  } catch (err) {
    if (id === analysisId) $('#lines').text('Could not reach the server. Is server.py running?');
    return;
  }
  if (id !== analysisId) return; // a newer position was requested meanwhile

  if (data.game_over) {
    $('#lines').text('Game over: ' + data.game_over);
    highlight([], 'hl-best');
    return;
  }

  $('#lines').html(data.lines.map((l, i) =>
    `<div class="line" onclick="playLine(${i})"><span class="score">${formatScore(l)}</span>${l.san}</div>`
  ).join(''));
  window.currentLines = data.lines;

  const top = data.lines[0];
  if (top) {
    const pct = top.mate !== null ? (top.mate > 0 ? 100 : 0) : winPct(top.cp);
    $('#evalWhite').css('height', pct + '%');
    $('#evalText').text(formatScore(top).replace('+', ''));
    highlight([top.first_uci.slice(0, 2), top.first_uci.slice(2, 4)], 'hl-best');
  }
}

function playLine(i) {
  const uci = window.currentLines[i].first_uci;
  playMove(uci.slice(0, 2), uci.slice(2, 4), uci[4] || 'q', false);
}

// ---------- Start ----------
board = Chessboard('board', {
  draggable: true,
  position: 'start',
  pieceTheme: PIECES,
  onDragStart, onDrop, onSnapEnd
});
$(window).on('resize', () => board.resize());
$('#gameSelect').on('change', e => loadGame(e.target.value));
$('#analyzedOnly').on('change', loadGames);

loadGames().then(() => loadGame(''));
</script>
</body>
</html>
